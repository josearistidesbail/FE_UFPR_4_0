<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FE_UFPR 4.0 - hand assembly tracker</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --mute:#6b6b70; --line:#e2e2e5; --ok:#2a9d3a; --bad:#d62828; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg);
         display:grid; grid-template-rows:auto 1fr; height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:16px; margin:0; }
  header label { color:var(--mute); }
  select, input[type=text], button { font:inherit; padding:4px 8px; border:1px solid #c9c9ce; border-radius:6px; background:#fff; }
  button { cursor:pointer; } button:hover { background:#f0f0f3; }
  .overall { flex:1; min-width:180px; display:flex; align-items:center; gap:8px; }
  .bar { flex:1; height:8px; background:#ececf0; border-radius:4px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  main { display:grid; grid-template-columns:1fr 430px; min-height:0; }
  #mapwrap { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px; align-items:center; }
  .tabs button.on { background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
  .tabs .hint { color:var(--mute); font-size:12px; margin-left:auto; }
  .map { flex:1; min-height:0; position:relative; background:#fff; }
  .map svg { position:absolute; inset:0; width:100%; height:100%; display:none; touch-action:none; user-select:none; }
  .map svg.on { display:block; }
  #tip { position:fixed; pointer-events:none; background:#1d1d1f; color:#fff; padding:6px 8px; border-radius:6px; font-size:12px;
         max-width:320px; display:none; z-index:9; }
  aside { overflow:auto; padding:8px 14px 40px; }
  .stage { margin:10px 0 16px; }
  .stage h2 { font-size:14px; margin:0; padding:6px 8px; border-radius:6px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .stage h2 .cnt { margin-left:auto; font-weight:500; font-size:12px; }
  .stage h2.sel { outline:2px solid #1d1d1f; }
  .stage .note { font-size:12px; color:var(--mute); font-style:italic; margin:4px 2px 4px; }
  .row { display:grid; grid-template-columns:22px 88px 1fr auto 22px; gap:6px; align-items:center; padding:3px 4px; border-radius:5px; }
  .row:hover { background:#f1f1f4; }
  .row.done .ref, .row.done .val { text-decoration:line-through; color:var(--mute); }
  .row.flag { background:#fdecec; }
  .row input { width:16px; height:16px; margin:0; cursor:pointer; }
  .ref { font-weight:650; }
  .val { font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .val small { color:var(--mute); font-family:ui-monospace, monospace; margin-left:4px; }
  .badge { font-size:11px; padding:1px 6px; border-radius:9px; background:#eee; color:#444; }
  .badge.bottom { background:#fff1d6; color:#8a5a00; }
  .badge.note { background:#e3f4ea; color:#1d6b3a; }
  .row .fl { border:0; background:none; padding:0; font-size:14px; opacity:.25; }
  .row.flag .fl, .row .fl:hover { opacity:1; }
  .task .val { white-space:normal; font-size:12.5px; grid-column:2 / 5; }
  /* board drawing */
  .edge { fill:none; stroke:#222; stroke-width:.25; }
  .pad0 { fill:#dcdcdc; } .cy { fill:none; stroke:#e9e9e9; stroke-width:.1; }
  .part { cursor:pointer; }
  .part .body { fill:var(--c); fill-opacity:.32; stroke:var(--c); stroke-width:.25; }
  .part .pad { fill:#555; }
  .part .pad.stripe { fill:#000; }
  .part text.minus { fill:#fff; stroke:none; font-size:2.6px; text-anchor:middle; font-weight:900; }
  .part .p1 { fill:#000; stroke:#fff; stroke-width:.12; }
  .part .bridge { stroke:#000; stroke-width:.7; stroke-linecap:round; }
  .part text { font-size:1.15px; font-weight:700; dominant-baseline:middle; paint-order:stroke; stroke:#fff; stroke-width:.35; fill:#111; }
  .part text.tick { display:none; font-size:3.2px; text-anchor:middle; fill:#0b6b18; stroke:#fff; stroke-width:.5; }
  .part.done .body { fill:var(--ok); fill-opacity:.55; stroke:#1a7a28; }
  .part.done text.tick { display:block; }
  .part.flag .body { stroke:var(--bad); stroke-width:.6; }
  .part.hl .body { stroke:#000; stroke-width:.7; }
  .part.dim { opacity:.2; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; grid-template-rows:55vh auto; } #mapwrap { border-right:0; } }
</style>
</head>

const STAGES = [{"n": 0, "name": "Before you start", "col": "#7f7f7f", "note": "JLC never confirmed the CPL rotations: look before adding anything.", "rows": [{"id": "T0a", "kind": "task", "text": "Inspect JLC-placed polarised parts: LEDs D4-D9, diodes, IC pin 1"}, {"id": "T0b", "kind": "task", "text": "Meter GND vs +24V_PROT, +5V, +3V3, +13V5_GATE, +/-15V_ISO: no shorts"}]}, {"n": 1, "name": "Bottom-side SMD", "col": "#E69F00", "note": "Do these before J3/J4/J5 go in (the connectors sit over them). D17: the band on the part goes on the black pad (cathode).", "rows": [{"id": "R2", "kind": "part", "ref": "R2", "val": "100k", "lcsc": "C25803", "side": "bottom", "note": ""}, {"id": "R3", "kind": "part", "ref": "R3", "val": "10k", "lcsc": "C25804", "side": "bottom", "note": ""}, {"id": "D17", "kind": "part", "ref": "D17", "val": "SMAJ5.0A", "lcsc": "C2925443", "side": "bottom", "note": ""}, {"id": "C119", "kind": "part", "ref": "C119", "val": "100nF 50V", "lcsc": "C14663", "side": "bottom", "note": ""}, {"id": "C25", "kind": "part", "ref": "C25", "val": "10uF 25V", "lcsc": "C15850", "side": "bottom", "note": ""}, {"id": "C26", "kind": "part", "ref": "C26", "val": "100nF 50V", "lcsc": "C14663", "side": "bottom", "note": ""}, {"id": "C27", "kind": "part", "ref": "C27", "val": "10uF 25V", "lcsc": "C15850", "side": "bottom", "note": ""}, {"id": "C28", "kind": "part", "ref": "C28", "val": "100nF 50V", "lcsc": "C14663", "side": "bottom", "note": ""}, {"id": "R118", "kind": "part", "ref": "R118", "val": "1M", "lcsc": "C22935", "side": "bottom", "note": ""}, {"id": "R119", "kind": "part", "ref": "R119", "val": "0R", "lcsc": "C21189", "side": "bottom", "note": ""}, {"id": "C113", "kind": "part", "ref": "C113", "val": "1nF C0G", "lcsc": "C106246", "side": "bottom", "note": ""}, {"id": "C120", "kind": "part", "ref": "C120", "val": "1nF C0G", "lcsc": "C106246", "side": "bottom", "note": ""}]}, {"n": 2, "name": "Power path + first power-on", "col": "#D55E00", "note": "Q1 tab: big chisel tip, no preheat needed. C1: the black stripe on the can goes on the black pad (\u2212, GND); cut corners of the base = + side.", "rows": [{"id": "F1", "kind": "part", "ref": "F1", "val": "5A 125V", "lcsc": "C48467", "side": "top", "note": ""}, {"id": "F2", "kind": "part", "ref": "F2", "val": "3A 63V", "lcsc": "C182445", "side": "top", "note": ""}, {"id": "F3", "kind": "part", "ref": "F3", "val": "0.2A 30V 1206L020", "lcsc": "C7542932", "side": "top", "note": ""}, {"id": "Q1", "kind": "part", "ref": "Q1", "val": "SQD50P06-15L", "lcsc": "C3281500", "side": "top", "note": ""}, {"id": "C1", "kind": "part", "ref": "C1", "val": "100uF 50V", "lcsc": "C2836439", "side": "top", "note": ""}, {"id": "U4", "kind": "part", "ref": "U4", "val": "URA2415YMD-6WR3", "lcsc": "C5369735", "side": "top", "note": ""}, {"id": "J1", "kind": "part", "ref": "J1", "val": "Mini-Fit Jr 5566-02A", "lcsc": "", "side": "top", "note": ""}, {"id": "T2a", "kind": "task", "text": "Recommended: wire strap F1 pad 2 to Q1 tab, over the 0.25 mm track"}, {"id": "T2b", "kind": "task", "text": "Bring-up A (S12 \u00a75): current-limited 24 V, check TP1 > TP5 > TP2 13.5 V > TP3 5 V > TP4 3.3 V > TP6/TP7 vs TP8, record idle current"}]}, {"n": 3, "name": "Logic + analog ICs (rails good)", "col": "#0072B2", "note": "Pin 1 = dot; check it before soldering the second side. R57/R105 = 3.00k, R58/R129 = 2.20k, 0.1 %, UNMARKED: one tape at a time, measure each.", "rows": [{"id": "U8", "kind": "part", "ref": "U8", "val": "SN74LVC1G11DBVR", "lcsc": "C22046", "side": "top", "note": ""}, {"id": "U5", "kind": "part", "ref": "U5", "val": "UCC27524DR", "lcsc": "C465729", "side": "top", "note": ""}, {"id": "U6", "kind": "part", "ref": "U6", "val": "UCC27524DR", "lcsc": "C465729", "side": "top", "note": ""}, {"id": "U7", "kind": "part", "ref": "U7", "val": "UCC27524DR", "lcsc": "C465729", "side": "top", "note": ""}, {"id": "L3", "kind": "part", "ref": "L3", "val": "ACT45B-101-2P-TL003", "lcsc": "C88056", "side": "top", "note": ""}, {"id": "R57", "kind": "part", "ref": "R57", "val": "3.00k 0.1%", "lcsc": "C136963", "side": "top", "note": ""}, {"id": "R105", "kind": "part", "ref": "R105", "val": "3.00k 0.1%", "lcsc": "C136963", "side": "top", "note": ""}, {"id": "R58", "kind": "part", "ref": "R58", "val": "2.20k 0.1%", "lcsc": "C861295", "side": "top", "note": ""}, {"id": "R129", "kind": "part", "ref": "R129", "val": "2.20k 0.1%", "lcsc": "C861295", "side": "top", "note": ""}, {"id": "U12", "kind": "part", "ref": "U12", "val": "OPA2376", "lcsc": "C46316", "side": "top", "note": ""}, {"id": "U13", "kind": "part", "ref": "U13", "val": "OPA2376", "lcsc": "C46316", "side": "top", "note": ""}, {"id": "U14", "kind": "part", "ref": "U14", "val": "OPA2376", "lcsc": "C46316", "side": "top", "note": ""}, {"id": "U15", "kind": "part", "ref": "U15", "val": "OPA2376", "lcsc": "C46316", "side": "top", "note": ""}, {"id": "U16", "kind": "part", "ref": "U16", "val": "OPA2376", "lcsc": "C46316", "side": "top", "note": ""}, {"id": "U17", "kind": "part", "ref": "U17", "val": "OPA2376", "lcsc": "C46316", "side": "top", "note": ""}]}, {"n": 4, "name": "Solder jumpers", "col": "#009E73", "note": "JP1, JP3, JP4, JP5: bridge 1-2 (never leave open). JP2: leave open. JP6: check it is bridged.", "rows": [{"id": "JP1", "kind": "part", "ref": "JP1", "val": "ILOCK_SEL", "lcsc": "", "side": "top", "note": "bridge 1-2"}, {"id": "JP2", "kind": "part", "ref": "JP2", "val": "SHLD_TIE", "lcsc": "", "side": "top", "note": "leave OPEN"}, {"id": "JP3", "kind": "part", "ref": "JP3", "val": "SRC SEL A", "lcsc": "", "side": "top", "note": "bridge 1-2"}, {"id": "JP4", "kind": "part", "ref": "JP4", "val": "SRC SEL B", "lcsc": "", "side": "top", "note": "bridge 1-2"}, {"id": "JP5", "kind": "part", "ref": "JP5", "val": "SRC SEL C", "lcsc": "", "side": "top", "note": "bridge 1-2"}, {"id": "JP6", "kind": "part", "ref": "JP6", "val": "CAN TERM bridged=120R", "lcsc": "", "side": "top", "note": "check bridged"}]}, {"n": 5, "name": "Connectors", "col": "#CC79A7", "note": "Solder J20-J23 while plugged onto the LaunchPad. J3-J5 DT15: #4-20 screws from the underside. GND pins: extra dwell.", "rows": [{"id": "J20", "kind": "part", "ref": "J20", "val": "LaunchPad J1+J3", "lcsc": "C492427", "side": "top", "note": ""}, {"id": "J21", "kind": "part", "ref": "J21", "val": "LaunchPad J4+J2", "lcsc": "C492427", "side": "top", "note": ""}, {"id": "J22", "kind": "part", "ref": "J22", "val": "LaunchPad J5+J7", "lcsc": "C492427", "side": "top", "note": ""}, {"id": "J23", "kind": "part", "ref": "J23", "val": "LaunchPad J8+J6", "lcsc": "C492427", "side": "top", "note": ""}, {"id": "J3", "kind": "part", "ref": "J3", "val": "LEM DT15-12PA key A", "lcsc": "", "side": "top", "note": ""}, {"id": "J4", "kind": "part", "ref": "J4", "val": "ENC DT15-12PB key B", "lcsc": "", "side": "top", "note": ""}, {"id": "J5", "kind": "part", "ref": "J5", "val": "VEH DT15-08PD key D", "lcsc": "", "side": "top", "note": ""}, {"id": "J2", "kind": "part", "ref": "J2", "val": "DSUB-37_Socket", "lcsc": "", "side": "top", "note": ""}]}];
const KEY = 'fe_ufpr4_hand_assembly_v1';
const ITEM = {}; STAGES.forEach(s => s.rows.forEach(r => { r.stage = s.n; ITEM[r.id] = r; }));
let db = JSON.parse(localStorage.getItem(KEY) || 'null') || { current: '1', boards: { '1': { done: {}, flag: {}, sn: '' } } };
const save = () => localStorage.setItem(KEY, JSON.stringify(db));
const cur = () => db.boards[db.current];
let filterStage = null;

// ---------- side tabs, zoom, pan ----------
const svgs = { top: document.getElementById('svg-top'), bottom: document.getElementById('svg-bottom') };
let side = 'top';
function showSide(s) {
  side = s;
  for (const k in svgs) svgs[k].classList.toggle('on', k === s);
  document.querySelectorAll('.tabs button[data-side]').forEach(b => b.classList.toggle('on', b.dataset.side === s));
}
document.querySelectorAll('.tabs button[data-side]').forEach(b => b.onclick = () => showSide(b.dataset.side));
document.getElementById('fit').onclick = () => svgs[side].setAttribute('viewBox', svgs[side].dataset.vb);
for (const svg of Object.values(svgs)) {
  const vb = () => svg.getAttribute('viewBox').split(' ').map(Number);
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), v = vb();
    const s = Math.max(v[2] / r.width, v[3] / r.height);
    const ox = v[0] - (r.width * s - v[2]) / 2, oy = v[1] - (r.height * s - v[3]) / 2;
    return [ox + (cx - r.left) * s, oy + (cy - r.top) * s, s]; };
  svg.addEventListener('wheel', e => { e.preventDefault();
    const [x, y] = toSvg(e.clientX, e.clientY), v = vb(), k = e.deltaY > 0 ? 1.18 : 1 / 1.18;
    svg.setAttribute('viewBox', [x - (x - v[0]) * k, y - (y - v[1]) * k, v[2] * k, v[3] * k].join(' ')); }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, v: vb(), moved: false }; });
  svg.addEventListener('pointermove', e => { if (!drag || !e.buttons) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; svg.setPointerCapture(e.pointerId); }
    if (!drag.moved) return;
    const s = toSvg(0, 0)[2];
    svg.setAttribute('viewBox', [drag.v[0] - dx * s, drag.v[1] - dy * s, drag.v[2], drag.v[3]].join(' ')); });
  svg.addEventListener('click', e => { if (drag && drag.moved) { drag = null; return; } drag = null;
    const g = e.target.closest('.part'); if (!g) return;
    e.shiftKey ? toggle(g.dataset.ref, 'flag') : toggle(g.dataset.ref, 'done'); });
}

// ---------- tooltip + highlight ----------
const tip = document.getElementById('tip');
const partEls = ref => document.querySelectorAll(`.part[data-ref="${ref}"]`);
document.getElementById('map').addEventListener('mousemove', e => {
  const g = e.target.closest('.part');
  if (!g) { tip.style.display = 'none'; return; }
  const r = ITEM[g.dataset.ref], st = STAGES.find(s => s.n === r.stage), b = cur();
  tip.innerHTML = `<b>${r.ref}</b> ${r.val}${r.lcsc ? ' · ' + r.lcsc : ''}<br>Stage ${st.n}: ${st.name}` +
    (r.note ? `<br>${r.note}` : '') + (b.done[r.id] ? '<br>✓ soldered' : '') + (b.flag[r.id] ? '<br>⚠ flagged for rework' : '');
  tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
document.getElementById('map').addEventListener('mouseleave', () => tip.style.display = 'none');
function hl(ref, on) {
  partEls(ref).forEach(g => g.classList.toggle('hl', on));
  if (on && ITEM[ref] && ITEM[ref].side && ITEM[ref].side !== side) showSide(ITEM[ref].side);
}

// ---------- state ----------
function toggle(id, what) {
  const m = cur()[what];
  if (m[id]) delete m[id]; else m[id] = new Date().toISOString();
  save(); render();
}
function render() {
  const b = cur();
  document.getElementById('sn').value = b.sn || '';
  const sel = document.getElementById('board');
  sel.innerHTML = Object.keys(db.boards).map(k => `<option value="${k}"${k === db.current ? ' selected' : ''}>Board ${k}${db.boards[k].sn ? ' (' + db.boards[k].sn + ')' : ''}</option>`).join('');
  document.querySelectorAll('.part').forEach(g => {
    const r = g.dataset.ref;
    g.classList.toggle('done', !!b.done[r]); g.classList.toggle('flag', !!b.flag[r]);
    g.classList.toggle('dim', filterStage !== null && +g.dataset.stage !== filterStage);
  });
  let all = 0, dn = 0;
  const L = document.getElementById('list'); L.innerHTML = '';
  for (const s of STAGES) {
    const d = s.rows.filter(r => b.done[r.id]).length; all += s.rows.length; dn += d;
    const div = document.createElement('div'); div.className = 'stage';
    const bg = s.col + '40';
    div.innerHTML = `<h2 style="background:${bg}" class="${filterStage === s.n ? 'sel' : ''}" title="Click to show only this stage on the map">
        Stage ${s.n} · ${s.name}<span class="cnt">${d}/${s.rows.length}${d === s.rows.length ? ' ✓' : ''}</span></h2>
      <div class="note">${s.note}</div>`;
    div.querySelector('h2').onclick = () => { filterStage = filterStage === s.n ? null : s.n; render(); };
    for (const r of s.rows) {
      const row = document.createElement('div');
      row.className = 'row' + (r.kind === 'task' ? ' task' : '') + (b.done[r.id] ? ' done' : '') + (b.flag[r.id] ? ' flag' : '');
      row.innerHTML = r.kind === 'task'
        ? `<input type="checkbox"${b.done[r.id] ? ' checked' : ''}><span class="val">${r.text}</span><button class="fl" title="Flag">⚠</button>`
        : `<input type="checkbox"${b.done[r.id] ? ' checked' : ''}><span class="ref">${r.ref}</span>
           <span class="val">${r.val}<small>${r.lcsc}</small></span>
           <span>${r.note ? `<span class="badge note">${r.note}</span>` : ''}${r.side === 'bottom' ? '<span class="badge bottom">bottom</span>' : ''}</span>
           <button class="fl" title="Flag for rework">⚠</button>`;
      row.querySelector('input').onchange = () => toggle(r.id, 'done');
      row.querySelector('.fl').onclick = () => toggle(r.id, 'flag');
      if (r.kind === 'part') { row.onmouseenter = () => hl(r.id, true); row.onmouseleave = () => hl(r.id, false); }
      div.appendChild(row);
    }
    L.appendChild(div);
  }
  document.getElementById('ovtxt').textContent = `${dn}/${all} done`;
  document.getElementById('ovbar').style.width = (100 * dn / all) + '%';
}

// ---------- header controls ----------
document.getElementById('board').onchange = e => { db.current = e.target.value; save(); render(); };
document.getElementById('addBoard').onclick = () => {
  const n = String(Math.max(...Object.keys(db.boards).map(Number)) + 1);
  db.boards[n] = { done: {}, flag: {}, sn: '' }; db.current = n; save(); render(); };
document.getElementById('sn').onchange = e => { cur().sn = e.target.value.trim(); save(); render(); };
document.getElementById('reset').onclick = () => {
  if (document.getElementById('reset').dataset.armed) { db.boards[db.current] = { done: {}, flag: {}, sn: cur().sn };
    save(); render(); delete document.getElementById('reset').dataset.armed; document.getElementById('reset').textContent = 'Reset board'; return; }
  const btn = document.getElementById('reset'); btn.dataset.armed = 1; btn.textContent = 'Click again to clear';
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = 'Reset board'; }, 3000); };
document.getElementById('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }));
  a.download = `fe_ufpr4_assembly_${new Date().toISOString().slice(0, 10)}.json`; a.click(); };
document.getElementById('import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  try { const d = JSON.parse(await e.target.files[0].text()); if (!d.boards) throw 0; db = d; save(); render(); }
  catch { document.getElementById('ovtxt').textContent = 'Import failed: not a tracker export file'; } e.target.value = ''; };
showSide('top');
render();
</script>
</body>
</html>
